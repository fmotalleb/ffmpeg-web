# GoReleaser configuration. Push a tag (`git tag v1.2.3 && git push --tags`)
# and .github/workflows/release.yml runs `goreleaser release --clean`,
# which cross-compiles the server, packs archives and publishes them
# together with the multi-platform container image.
#
# Check it locally with `goreleaser check`, or build the archives without
# publishing using `goreleaser build --snapshot --clean`.

version: 2

project_name: ffmpeg-web

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: ffmpeg-web
    main: .
    binary: ffmpeg-web
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - "-X github.com/FMotalleb/go-tools/git.Version={{.Version}}"
      - "-X github.com/FMotalleb/go-tools/git.Commit={{.ShortCommit}}"
      - "-X github.com/FMotalleb/go-tools/git.Date={{.Date}}"
      - "-X github.com/FMotalleb/go-tools/git.Branch={{.Branch}}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

dockers_v2:
  - id: scratch
    images:
      - ghcr.io/fmotalleb/ffmpeg-web
    ids:
      - ffmpeg-web
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}-scratch"
      - "latest-scratch"
      - "latest"
    dockerfile: Dockerfile
    build_args:
      FFMPEG_VERSION: "9"
      FFMPEG_VARIANT: "scratch"

  - id: alpine
    images:
      - ghcr.io/fmotalleb/ffmpeg-web
    ids:
      - ffmpeg-web
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}-alpine"
      - "latest-alpine"
    dockerfile: Dockerfile
    build_args:
      FFMPEG_VERSION: "9"
      FFMPEG_VARIANT: "alpine"

  - id: ubuntu
    images:
      - ghcr.io/fmotalleb/ffmpeg-web
    ids:
      - ffmpeg-web
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}-ubuntu"
      - "latest-ubuntu"
    dockerfile: Dockerfile
    build_args:
      FFMPEG_VERSION: "9"
      FFMPEG_VARIANT: "ubuntu"

  - id: ubuntu-edge
    images:
      - ghcr.io/fmotalleb/ffmpeg-web
    ids:
      - ffmpeg-web
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}-ubuntu-edge"
      - "latest-ubuntu-edge"
    dockerfile: Dockerfile
    build_args:
      FFMPEG_VERSION: "9"
      FFMPEG_VARIANT: "ubuntu-edge"

  - id: vaapi
    images:
      - ghcr.io/fmotalleb/ffmpeg-web
    ids:
      - ffmpeg-web
    platforms:
      - linux/amd64
    tags:
      - "{{ .Tag }}-vaapi"
      - "latest-vaapi"
    dockerfile: Dockerfile
    build_args:
      FFMPEG_VERSION: "9"
      FFMPEG_VARIANT: "vaapi"

  - id: nvidia
    images:
      - ghcr.io/fmotalleb/ffmpeg-web
    ids:
      - ffmpeg-web
    platforms:
      - linux/amd64
    tags:
      - "{{ .Tag }}-nvidia"
      - "latest-nvidia"
    dockerfile: Dockerfile
    build_args:
      FFMPEG_VERSION: "9"
      FFMPEG_VARIANT: "nvidia"

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - AGENTS.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"

release:
  draft: false
  prerelease: auto
  footer: |
    **Full changelog**: https://github.com/fmotalleb/ffmpeg-web/compare/{{ .PreviousTag }}...{{ .Tag }}
