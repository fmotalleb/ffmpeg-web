# GoReleaser configuration. Push a tag (`git tag v1.2.3 && git push --tags`)
# and .github/workflows/release.yml runs `goreleaser release --clean`, which
# cross-compiles the server, packs archives and publishes them on the release.
#
# Check it locally with `goreleaser check`, or build the archives without
# publishing using `goreleaser build --snapshot --clean`.
version: 2

project_name: ffmpeg-web

before:
  hooks:
    - go mod tidy

builds:
  - id: transcoder
    main: .
    binary: ffmpeg-web
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - AGENTS.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"

release:
  draft: false
  prerelease: auto
  footer: |
    **Full changelog**: https://github.com/fmotalleb/ffmpeg-web/compare/{{ .PreviousTag }}...{{ .Tag }}

    ffmpeg and ffprobe have to be on PATH; the container image already has them.
